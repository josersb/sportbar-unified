# ── SportBar v1.1.0 — Docker Compose (producción) ──

services:
  sportbar:
    build:
      context: ../../..                          # raíz del proyecto sportbar-unified
      dockerfile: scripts/deploy/docker/Dockerfile
    container_name: sportbar-v1.1.0
    ports:
      - "${PORT:-3051}:${PORT:-3051}"
    volumes:
      # Solo state.json y logs son escribibles (Capa 3: filesystem readonly)
      - sportbar_data:/app/data
    environment:
      - PORT=${PORT:-3051}
      - NODE_ENV=production
      - ARRANGER_HOST=192.168.2.254
      - ARRANGER_PORT=80
      - VITE_ARRANGER_TOKEN=${VITE_ARRANGER_TOKEN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:$$PORT/api/state\",r=>process.exit(r.statusCode===200?0:1))' "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ── Docker Security (Capa 2 + 3 + 4) ──
    read_only: true                    # filesystem readonly (excepto volumes)
    tmpfs:
      - /tmp                           # node necesita /tmp escribible
    cap_drop:
      - ALL                            # sin capabilities del kernel
    security_opt:
      - no-new-privileges:true         # bloquea escalación de privilegios
    # ── Red ──
    networks:
      - sportbar_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sportbar_data:
    name: sportbar-v1.1.0-data

networks:
  sportbar_net:
    name: sportbar-net
    driver: bridge
